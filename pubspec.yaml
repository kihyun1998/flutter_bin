name: flutter_bin
description: "A Flutter plugin to retrieve metadata (version, product name, and more) from binary files on desktop platforms. Supports Windows and macOS."
version: 2.0.0
homepage: https://github.com/kihyun1998/flutter_bin
repository: https://github.com/kihyun1998/flutter_bin
issue_tracker: https://github.com/kihyun1998/flutter_bin/issues
documentation: https://github.com/kihyun1998/flutter_bin/blob/main/README.md

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  ffi: ^2.1.0
  plist_parser: ^0.2.7
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: FlutterBinPluginCApi
      macos:
        pluginClass: FlutterBinPlugin