name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pinned so CI does not drift with the runner's default Flutter/Dart.
env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  # flutter_bin is a pure-Dart package, so the tests run with `dart test` on
  # each OS. Each runner exercises its own platform code: the Windows job runs
  # the `@TestOn('windows')` FFI tests, the macOS job runs the `@TestOn('mac-os')`
  # Info.plist tests, and all three run the platform-independent tests.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: dart --version

      - name: Install dependencies
        run: dart pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  # The example is still a Flutter app; make sure it builds against the
  # pure-Dart package on the desktop platforms it targets.
  example:
    name: Example build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: flutter build windows
          - os: macos-latest
            build: flutter build macos --debug
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Build example
        run: ${{ matrix.build }}
        working-directory: example
