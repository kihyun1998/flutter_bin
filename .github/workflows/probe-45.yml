name: Probe 45 (one-off)

on:
  push:
    branches: [claude/eager-lamport-wrhge3]
    paths: ['.github/probe-45/**', '.github/workflows/probe-45.yml']

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - run: dart pub get
      - run: .github/probe-45/run.sh
