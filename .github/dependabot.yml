version: 2
updates:
  # The published package: one PR per dependency.
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    labels:
      - "needs-triage"

  # The example app: one grouped PR.
  - package-ecosystem: "pub"
    directory: "/example"
    schedule:
      interval: "monthly"
    groups:
      example:
        patterns:
          - "*"
    labels:
      - "needs-triage"

  # Actions pinned in .github/workflows: one grouped PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "needs-triage"
